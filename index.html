<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de CEP e Frete</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>

        <h2>Consulta de CEP e Frete</h2>

        <div class="enderecos">

            <div class="box-endereco">

                <h3>Remetente</h3>

                <label for="cepRemetente">
                    CEP
                </label>

                <input
                    type="text"
                    id="cepRemetente"
                    maxlength="8"
                    placeholder="Digite o CEP"
                >

                <button
                    type="button"
                    id="buscarRemetente"
                >
                    Buscar Remetente
                </button>

                <label for="cidadeRemetente">
                    Cidade
                </label>

                <input
                    type="text"
                    id="cidadeRemetente"
                    readonly
                >

                <label for="estadoRemetente">
                    Estado
                </label>

                <input
                    type="text"
                    id="estadoRemetente"
                    readonly
                >

            </div>


            <div class="box-endereco">

                <h3>Destinatário</h3>

                <label for="cepDestinatario">
                    CEP
                </label>

                <input
                    type="text"
                    id="cepDestinatario"
                    maxlength="8"
                    placeholder="Digite o CEP"
                >

                <button
                    type="button"
                    id="buscarDestinatario"
                >
                    Buscar Destinatário
                </button>

                <label for="cidadeDestinatario">
                    Cidade
                </label>

                <input
                    type="text"
                    id="cidadeDestinatario"
                    readonly
                >

                <label for="estadoDestinatario">
                    Estado
                </label>

                <input
                    type="text"
                    id="estadoDestinatario"
                    readonly
                >

            </div>

        </div>


        <div class="box-produto">

            <h3>Dados do Produto</h3>

            <label for="peso">
                Peso (kg)
            </label>

            <input
                type="number"
                id="peso"
                step="0.1"
                min="0"
                placeholder="Ex: 2.5"
            >

            <label for="largura">
                Largura (cm)
            </label>

            <input
                type="number"
                id="largura"
                min="0"
                placeholder="Ex: 20"
            >

            <label for="altura">
                Altura (cm)
            </label>

            <input
                type="number"
                id="altura"
                min="0"
                placeholder="Ex: 15"
            >

            <label for="comprimento">
                Comprimento (cm)
            </label>

            <input
                type="number"
                id="comprimento"
                min="0"
                placeholder="Ex: 30"
            >

            <button
                type="button"
                id="calcular"
            >
                Calcular Frete
            </button>

        </div>


        <div class="box-resultado">

            <h3>Resultado do Frete</h3>

            <div id="resultado">

                <p class="mensagem">
                    O resultado da cotação aparecerá aqui.
                </p>

            </div>

        </div>

    </form>


    <script src="script.js"></script>

</body>

</html>
